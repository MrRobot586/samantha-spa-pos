<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Samantha Spa">
    <defs>
        <!-- Mismo degradado de .brand__icon: brand-600 → brand-400 (to top right). -->
        <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#c5356e"/>
            <stop offset="1" stop-color="#e57ca8"/>
        </linearGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brand)"/>
    <!-- La «S» es un trazo (dos arcos elípticos), no texto: así se dibuja igual
         en todos los navegadores sin depender de tipografías. -->
    <path d="M43 22 A11 10 0 1 0 32 32 A11 10 0 1 1 21 42"
          fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round"/>
</svg>
