name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Pruebas de dominio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  smoke:
    name: Smoke E2E (Chrome headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Localizar Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"
      - run: npm run smoke